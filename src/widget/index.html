<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';">
  <title>claudeState</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <!--
    한 행에 두 공급자를 나란히 둔다. Codex 가 감지되지 않으면 .widget 에 has-codex 가
    붙지 않고, 그 상태에서는 오른쪽 열과 아이콘이 숨겨지고 프로그레스바가 살아나
    기존 280x40 모습 그대로가 된다.
  -->
  <!-- title 속성을 두면 네이티브 툴팁이 상세 패널과 겹쳐 뜬다. 쓰지 않는다. -->
  <div id="widget" class="widget">
    <div class="row">
      <span class="label">S</span>
      <div class="col claude">
        <img class="ico" src="../../assets/claude.svg" alt="">
        <div class="bar"><div id="session-bar" class="bar-fill session"></div></div>
        <span id="session-text" class="pct">--</span>
        <span id="session-when" class="when">--</span>
      </div>
      <div class="col codex">
        <img class="ico" src="../../assets/codex.svg" alt="">
        <span id="cx-session-text" class="pct">--</span>
        <span id="cx-session-when" class="when">--</span>
      </div>
    </div>
    <div class="row">
      <span class="label">W</span>
      <div class="col claude">
        <img class="ico" src="../../assets/claude.svg" alt="">
        <div class="bar"><div id="weekly-bar" class="bar-fill weekly"></div></div>
        <span id="weekly-text" class="pct">--</span>
        <span id="weekly-when" class="when">--</span>
      </div>
      <div class="col codex">
        <img class="ico" src="../../assets/codex.svg" alt="">
        <span id="cx-weekly-text" class="pct">--</span>
        <span id="cx-weekly-when" class="when">--</span>
      </div>
    </div>
    <div id="status" class="status"></div>
  </div>
  <script src="../shared/format.js"></script>
  <script src="widget.js"></script>
</body>
</html>
